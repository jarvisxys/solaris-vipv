# E5 daily archetypes A1-A4 (workflow guide Sec. 5, E5 table). src/solaris/trajectory/schedules.py.
# Author decisions 2026-10-18:
#  - Demand is the conference model of the B0 scenario named here, driven every day of the
#    year (50 km/day for A1-A3 as Scenario II, 100 km/day combined cycle for A4 as Scenario I),
#    with the archetype's trip hours. On weekends the daytime parking moves to the evening site.
#  - Trip hour 17 replays the frozen 16:00 SUMO traces with the clock moved +1 h
#    (traces depart 08:00-16:00 only; P6 stays frozen).
# Each trip hour drives N = drive_fraction(km, city) x 3600 s from the start of the hour
# (the conference time split), shared equally and in order by the listed routes. Each route
# replays its trace from the start, first direction then the other, looping if needed.

demand_seed: medium                 # SUMO demand of the replayed traces
trace_departures: ["08:00", "10:00", "12:00", "14:00", "16:00"]
trace_for_hour:                     # trip hour -> SUMO departure replayed (clock shifted)
  17: "16:00"

headings:                           # parked headings averaged per site (E4 runs N/E/S/W)
  P1: [N, E, S, W]
  P2: [N, S]                        # curb on Central Ave: along the avenue only
  P3: [N, E, S, W]
  P5: [N, E, S, W]

archetypes:
  A1:
    name: Suburban commuter
    scenario: II
    trips:
      - {hour: 8, routes: [R-MIXED, R-OPEN], first: fwd}
      - {hour: 17, routes: [R-OPEN, R-MIXED], first: rev}
    parking:                        # hours are inclusive ranges of clock hours
      weekday: {default: P3, ranges: [{hours: [8, 16], site: P1}]}
      weekend: {default: P3}
  A2:
    name: Downtown, street
    scenario: II
    trips:
      - {hour: 8, routes: [R-DENSE, R-OPEN], first: fwd}
      - {hour: 17, routes: [R-OPEN, R-DENSE], first: rev}
    parking:
      weekday: {default: P3, ranges: [{hours: [8, 16], site: P2}]}
      weekend: {default: P3}
  A3:
    name: Downtown, shaded
    scenario: II
    trips:
      - {hour: 8, routes: [R-DENSE, R-OPEN], first: fwd}
      - {hour: 17, routes: [R-OPEN, R-DENSE], first: rev}
    parking:
      weekday: {default: P3, ranges: [{hours: [8, 16], site: P5}]}
      weekend: {default: P3}
  A4:
    name: High-use fleet (100 km/day)
    scenario: I
    trips:
      - {hour: 8, routes: [R-OPEN, R-MIXED, R-DENSE], first: fwd}
      - {hour: 10, routes: [R-OPEN, R-MIXED, R-DENSE], first: fwd}
      - {hour: 12, routes: [R-OPEN, R-MIXED, R-DENSE], first: fwd}
      - {hour: 14, routes: [R-OPEN, R-MIXED, R-DENSE], first: fwd}
      - {hour: 16, routes: [R-OPEN, R-MIXED, R-DENSE], first: fwd}
    parking:                        # short stops alternate downtown curb and the open lot
      weekday:
        default: P1
        ranges:
          - {hours: [8, 9], site: P2}
          - {hours: [10, 11], site: P1}
          - {hours: [12, 13], site: P2}
          - {hours: [14, 15], site: P1}
          - {hours: [16, 16], site: P2}
      weekend: {default: P1}
