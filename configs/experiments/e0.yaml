  - {id: wltp.low_err_pct, where: Sec. VI-C, printed: -0.71, basis: none}
  - {id: wltp.medium_err_pct, where: Sec. VI-C, printed: 0.55, basis: none}
  - {id: wltp.vmax_kmh, where: Sec. VI-C, printed: 124.7, basis: none}
