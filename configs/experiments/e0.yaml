# E0 -- reproduce and reconcile the conference baseline (workflow guide, Sec. 5).
#
# `expected` lists every number printed in the conference paper that solaris.py
# emits. Each value is checked against the legacy module AND the refactored core
# by tests/test_regression_v1.py; the ids are computed by
# solaris.core.conference.conference_values().
#
#   printed  value as printed in the paper
#   tol      |computed - printed| <= tol; default = half a unit of the last printed digit
#   op       "eq" (default, uses tol) or "lt" (computed < printed, for "< x" claims)
#   basis    climate behind the number: synthetic | gsa_annual | tmy_hourly | none
#   requires input file needed (test skips with a reason when absent)
#
# Guide rule: every journal baseline comes from the measured TMY run (Table B0,
# rule e0_measured). Synthetic values stay only as a labelled historical row.

inputs:
  tmy_phoenix:
    path: data/323705_33.45_-112.06_tmy-2023.csv
    sha256: a7e851c33c58b88cd18459321a4630bfc4486297e518e18fbeccd21d6a3e687a
    source: NREL NSRDB GOES TMY v4, PSM v4.0.1, location 323705 (33.45, -112.06), tmy-2023, local time (UTC-7)
  tmy_london:
    path: data/tmy_51_526_-0_129_2005_2023.csv
    sha256: null        # not yet supplied: PVGIS 5.2 TMY, 51.526 / -0.129, 2005-2023
    source: JRC PVGIS 5.2 TMY

b0:
  site: Phoenix
  scenarios: [II, I]
  kappa_sensitivity: [0.60, 0.70]
  out_table: results/e0/table_b0.csv
  out_pareto: results/e0/table_b0_pareto.csv

expected:
  # ---------------------------------------------------------------- Sec. V / Table I
  - {id: mass.harvest_subtotal_kg, where: Table I, printed: 182, tol: 0, basis: none}
  - {id: mass.P0_kg, where: Table I, printed: 2482, tol: 0, basis: none}
  - {id: mass.PA_kg, where: Table I, printed: 2696, tol: 0, basis: none}

  # ---------------------------------------------------------------- Sec. VI-B TEG
  - {id: teg.dT_leg_K, where: Sec. VI-B, printed: 3.8, basis: none}
  - {id: teg.q_through_Wm2, where: Sec. VI-B, printed: 565, basis: none}
  - {id: teg.P_matched_W, where: Sec. VI-B, printed: 3.8, basis: none}
  - {id: teg.E_kWh_day, where: Sec. VI-B, printed: 0.019, basis: none}
  - {id: teg.P_opt_W, where: Sec. VI-B "caps near 11 W", printed: 11, basis: none}
  - {id: teg.tradeoff_kWh, where: Sec. V, printed: 17.5, basis: none}
  - {id: teg.tradeoff_days, where: Sec. V "~920 days", printed: 920, tol: 5, basis: none}
  - {id: teg.tradeoff_years, where: Sec. V, printed: 2.5, basis: none}

  # ---------------------------------------------------------------- Sec. VI-C WLTP
  - {id: wltp.total_km, where: Sec. VI-C, printed: 23.29, basis: none}
