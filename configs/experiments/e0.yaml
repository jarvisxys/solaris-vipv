# E0 -- reproduce and reconcile the conference baseline (workflow guide, Sec. 5).
#
# Baseline: the final ITEC-AP 2026 paper (docs/SOLARIS__Final.pdf) and its toolkit v1.1.0
# (src/solaris/legacy/solaris_v110.py; github.com/Anandsagar18/Solaris @ 8201cee).
# `expected` lists every number printed in that paper that the toolkit emits. Each value is
# checked against the legacy module AND the refactored core by tests/test_regression_v1.py;
# the ids are computed by solaris.core.conference.conference_values().
#
#   printed  value as printed in the paper
#   tol      |computed - printed| <= tol; default = half a unit of the last printed digit
#   op       "eq" (default, uses tol) or "lt" (computed < printed, for "under x" claims)
#   basis    climate behind the number: synthetic | gsa_annual | tmy | none
#   requires "tmy": needs every input below (test skips with a reason when one is absent)
#
# Guide rule: every journal baseline comes from the satellite TMY run (Table B0, rule
# e0_measured). Synthetic (idealized-climate) values stay only as labelled historical rows.

inputs:
  # E0/P2/E2/E5 anchor: the same NSRDB TMY-2023 downloaded in local time. It loads to the
  # identical (GHI, T) series as tmy_phoenix_2023 after its UTC -> local roll (asserted).
  tmy_phoenix:
    path: data/323705_33.45_-112.06_tmy-2023.csv
    sha256: a7e851c33c58b88cd18459321a4630bfc4486297e518e18fbeccd21d6a3e687a
    source: NREL NSRDB GOES TMY v4, PSM v4.0.1, location 323705 (33.45, -112.06), tmy-2023, local time (UTC-7)
  # Weather files shipped with v1.1.0 (git blob bytes, UTC timestamps), under data/conference/.
  tmy_phoenix_2023:
    path: data/conference/phoenix/nsrdb_tmy/323705_33.45_-112.06_tmy-2023.csv
    sha256: 3da4773a4f2384fa9943457e6480d92509433e854febef0e5c60f1b75c171655
    source: NREL NSRDB PSM v4.0.1, location 323705, TMY-2023, UTC
  tmy_phoenix_2022:
    path: data/conference/phoenix/nsrdb_tmy/323705_33.45_-112.06_tmy-2022.csv
    sha256: d36147f979dc57d14907ba5e665377c8ea9863812cbe525cc5eee803cf20031d
    source: NREL NSRDB PSM v4.0.1, location 323705, TMY-2022, UTC
  tmy_phoenix_2024:
    path: data/conference/phoenix/nsrdb_tmy/323705_33.45_-112.06_tmy-2024.csv
    sha256: 2858d34e8b5c03870e80a5038d855394b1583219574c03685234cadfe03c2034
    source: NREL NSRDB PSM v4.0.1, location 323705, TMY-2024, UTC
  tmy_phoenix_2025:
    path: data/conference/phoenix/nsrdb_tmy/323705_33.45_-112.06_tmy-2025.csv
    sha256: 2c60c1d6043a094b276c45e64c066f9e0f2db9de94135356d29bbc06c40fb16d
    source: NREL NSRDB PSM v4.0.1, location 323705, TMY-2025, UTC
  tmy_lucknow:
    path: data/conference/lucknow/nsrdb_tmy/46088_26.85_80.95_tmy.csv
    sha256: b3780c35a095fdb51d13380b8e3d2220a2f8469106aca5f669ca3639987e5cd7
    source: NREL NSRDB SUNY International (10 km, 2000-2014), TMY, location 46088 (26.85, 80.95), UTC
  tmy_london:
    path: data/conference/london/pvgis_tmy/tmy_51.526_-0.129_2005_2023.csv
    sha256: 4570905efc4603bbdd83d84df487d570f9a26d36e38bbeeb8ae898ad2dc41970
    source: EC-JRC PVGIS 5.3 TMY (PVGIS-SARAH3, 2005-2023), 51.526 / -0.129, UTC

b0:
  sites: [Phoenix, Lucknow, London]
  scenarios: [II, I]
  pareto_site: Phoenix
  out_table: results/e0/table_b0.csv
  out_pareto: results/e0/table_b0_pareto.csv
  out_summary: results/e0/summary_b0.json

