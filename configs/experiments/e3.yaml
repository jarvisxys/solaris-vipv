# E3 -- driving shading on real routes (workflow guide Sec. 5). experiments/e3_driving/run.py.
routes: [R-OPEN, R-DENSE, R-MIXED]
directions: [fwd, rev]
departures: ["08:00", "10:00", "12:00", "14:00", "16:00"]
days: ["2023-03-21", "2023-06-21", "2023-09-21", "2023-12-21"]
demand: [low, medium, high]      # SUMO seeds (configs/site/phoenix.yaml: sumo.demand)
skies: [clear, tmy]              # pvlib Ineichen (geometric study), then the matching TMY day
