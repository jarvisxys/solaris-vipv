# Phoenix site definition. Values marked null are set in the phase noted.

name: phoenix
timezone: America/Phoenix        # MST, UTC-7 all year, no DST. Never America/Denver.

crs:
  horizontal: EPSG:26912         # NAD83 / UTM zone 12N
  vertical: EPSG:5703            # NAVD88 height
  compound: EPSG:26912+5703
  # UTM grid north is ~0.6 deg from true north here; read the exact meridian
  # convergence from pyproj get_factors() before marching rays (P4).

enu_origin:                      # Unity CesiumGeoreference origin (P3): Central Ave & Washington St
  lat_deg: 33.4484               # NAD83; Cesium reads it as WGS84 (~1 m apart, visual only)
  lon_deg: -112.0740
  h_ellipsoid_m: null            # DEM ground + GEOID18 here; written by rule geom_enu_origin

aoi:                             # routes + parking sites + buffer (P3)
  buffer_m: 1000                 # shadow length H/tan(alpha): 150 m tower at 10 deg ~ 850 m
  shape: bbox                    # bounding box of the buffered seeds (author decision 2026-10-16)
  seeds:                         # [lat, lon], workflow guide Sec. 3; approximate, snapped in P6
    R-OPEN: [[33.378, -112.074], [33.378, -111.978]]
    R-DENSE: [[33.495, -112.074], [33.4466, -112.074], [33.4466, -112.0652],
              [33.4517, -112.0652], [33.4517, -112.074]]
    R-MIXED: [[33.509, -112.083], [33.509, -111.987]]
    R-TUNNEL: [[33.4625, -112.100], [33.4600, -112.0436]]
    P1: [[33.444, -112.066]]
    P2: [[33.449, -112.074]]
    P3: [[33.469, -112.090]]
  # polygon: data/derived/aoi.geojson (rule geom_aoi)

geometry:                        # P3 build parameters (workflow guide Sec. 2, steps 1-8)
  resolution_m: 0.5
  tile_m: 500                    # raster tiles and Unity mesh tiles
  tile_margin_m: 20              # lidar read around each tile (HAG, IDW, blob edges)
  noise_classes: [7, 18]
  dtm_fill_max_m: 250            # gdal FillNodata search distance (largest building footprint)
  naip_year: 2021                # NDVI for tree/building split; lidar flown 2020-10 to 2021-12
  tree: {ndsm_min_m: 2.0, ndsm_max_m: 35.0, ndvi_min: 0.2, footprint_buffer_m: 1.0}
  # ndsm_max_m: taller "green" pixels are tower walls (NAIP relief displacement), not trees;
  # the tallest Washingtonia palms here reach ~33 m.
  building: {ndsm_min_m: 2.5, ndvi_max: 0.15}
  min_blob_m2: 4.0               # cars, poles, signs
  covered_ndsm_m: 4.5            # road point under DSM - DTM above this is covered
  mesh: {max_error_m: 0.25, skirt_m: 1.0}
  freshness: {corridor_m: 250, min_area_m2: 50, min_height_m: 8.0, built_frac_max: 0.3,
              demolished_min_area_m2: 400, footprint_tolerance_m: 3.0, floor_height_m: 3.5}
  # demolished_min_area_m2: smaller unmapped lidar blobs downtown are canopies, rooftop
  # structures and shadowed trees, not demolished buildings.

nsrdb:                           # fetched by src/solaris/weather (P2) into data/raw/nsrdb/
  location_id: 323705            # TMY cell; the CONUS 5-min cell is 518064 (33.46, -112.07)
  lat: 33.45
  lon: -112.06
  utc: false                     # stamps in local standard time (UTC-7), as the pinned E0 TMY
  attributes: [ghi, dni, dhi, clearsky_ghi, clearsky_dni, clearsky_dhi, solar_zenith_angle,
               air_temperature, dew_point, relative_humidity, surface_pressure, wind_speed,
               wind_direction, surface_albedo, total_precipitable_water, cloud_type, fill_flag]
  tmy: {dataset: GOES TMY v4, version: PSM v4.0.1, name: tmy-2023, interval_min: 60,
        reference_year: 2023}      # TMY months come from different years; relabelled to this one
  conus_5min: {dataset: GOES CONUS v4, years: [2018, 2024], sensitivity_year: 2023,
               interval_min: 5}

shading:                         # P4 raster horizon engine (src/solaris/shading)
  n_azimuth: 360                 # horizon masks: 360 azimuth bins x 0.5 deg elevation bins
  elevation_step_deg: 0.5
  max_distance_m: 1000           # = AOI buffer: 150 m tower at 10 deg casts ~850 m
  near_m: 50                     # march at half-pixel steps out to here,
  growth: 0.005                  # then grow each step by 0.5 % of the distance

routes:                          # P6 route selection (workflow guide Sec. 3), routes/select_routes.py
  road_types: [trunk, primary, secondary]
  street_suffix: "(Street|Avenue|Road|Boulevard|Drive|Parkway)$"   # arterials, not freeways
  sample_step_m: 10
  eye_height_m: 1.8              # vehicle roof
  window_m: 8000                 # candidate routes: 8 km windows along each arterial,
  stride_m: 1000                 # every 1 km; whole arterials of 6-10 km also qualify
  min_m: 6000
  max_m: 10000
  min_coverage: 0.9              # share of a window's length that has road points
  mixed_band: [0.4, 0.6]         # Mixed = highest SVF variance with mean SVF in this quantile band
  version: v1

sumo:                            # P6 traffic traces (separate 'sumo' conda env, SUMO 1.28)
  sim_start_local: "07:30"       # MST; departures are local standard time
  departures: ["08:00", "10:00", "12:00", "14:00", "16:00"]
  end_s: 36000                   # 07:30 + 10 h
  step_s: 1                      # 1 Hz FCD
  corridor_buffer_m: 1500        # road network kept around the routes
  demand:                        # background trips over the network (randomTrips)
    low: {seed: 1, period_s: 6.0}
    medium: {seed: 2, period_s: 3.0}
    high: {seed: 3, period_s: 1.5}

parking:                         # P6 parking sites (guide Sec. 3 table), chosen from SVF
  search_radius_m: 200           # around each seed
  grid_m: 2.0
  P1: {svf_min: 0.95, canopy_free_m: 20}
  P2: {svf_max: 0.5, street: Central Avenue, lat_range: [33.4483, 33.4508],
       curb_offsets_m: [4.0, 5.5, 7.0], min_wall_distance_m: 4.0,
       axis_lon: -112.0740, axis_tolerance_m: 15}   # Central Ave axis (OSM ways jog onto couplets)
  # P2: a parked car's centre sits >= 4 m off the building face (sidewalk ~3 m + half the car)
  P3: {canopy_within_m: 5, building_within_m: 15}
  P4: {footprint_class: parking, min_height_m: 8}
  P5: {canopy_height_m: 4.0, canopy_across_m: 3.0, canopy_along_m: 6.0}   # at the P1 lot
  headings_deg: {N: 0, E: 90, S: 180, W: 270}

lidar:
  project: AZ_MaricopaPinal_2020_B20   # USGS 3DEP, public domain, flown 2020-10-02 to 2021-12-18
  ept: https://s3-us-west-2.amazonaws.com/usgs-lidar-public/AZ_MaricopaPinal_1_2020/ept.json
  # Only part _1_ exists; it covers 32.65-33.88 N, 112.79-111.06 W. EPSG:3857 horizontal,
  # NAVD88 heights (ground downtown 331.7 m); classes 1, 2, 7 (no building class).
